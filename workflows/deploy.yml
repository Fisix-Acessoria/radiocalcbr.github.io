name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Create config.js with Firebase config
        run: |
          echo "// 🔥 Configuração do Firebase (gerada automaticamente)" > assets/js/config.js
          echo "const FIREBASE_CONFIG = {" >> assets/js/config.js
          echo "    apiKey: \"${{ secrets.FIREBASE_API_KEY }}\"," >> assets/js/config.js
          echo "    authDomain: \"${{ secrets.FIREBASE_AUTH_DOMAIN }}\"," >> assets/js/config.js
          echo "    projectId: \"${{ secrets.FIREBASE_PROJECT_ID }}\"," >> assets/js/config.js
          echo "    storageBucket: \"${{ secrets.FIREBASE_STORAGE_BUCKET }}\"," >> assets/js/config.js
          echo "    messagingSenderId: \"${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}\"," >> assets/js/config.js
          echo "    appId: \"${{ secrets.FIREBASE_APP_ID }}\"," >> assets/js/config.js
          echo "    measurementId: \"${{ secrets.FIREBASE_MEASUREMENT_ID }}\"" >> assets/js/config.js
          echo "};" >> assets/js/config.js
          echo "" >> assets/js/config.js
          echo "console.log('✅ Firebase config carregado do ambiente!');" >> assets/js/config.js
      
      - name: Verify config.js was created
        run: cat assets/js/config.js
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          force_orphan: true